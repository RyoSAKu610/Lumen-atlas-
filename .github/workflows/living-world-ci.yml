name: Living World Prototype CI
on:
  pull_request:
    paths: ['prototypes/living-world/**', '.github/workflows/living-world-ci.yml']
  push:
    branches: [main, 'cursor/living-world-vertical-slice-9dda']
    paths: ['prototypes/living-world/**', '.github/workflows/living-world-ci.yml']
permissions:
  contents: read
concurrency:
  group: living-world-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototypes/living-world
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: prototypes/living-world/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run validate:data
      - run: npm run build
      - name: Multi-day seeded ecology smoke run
        run: npm run simulate -- --days 3 --seed 20261126 --diagnose-water --assert-water-survival
      - name: One-week ecological resilience smoke run
        run: npm run simulate -- --days 7 --seed 20261126 --diagnose-water --assert-water-survival

      - name: Population scaling benchmark
        run: npm run bench
