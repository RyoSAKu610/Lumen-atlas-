[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "living-atlas-reference-ecology"
version = "0.1.0"
description = "Deterministic engine-independent ecology behavior reference for LIVING ATLAS"
